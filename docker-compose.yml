services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      NEXT_TELEMETRY_DISABLED: 1
      APP_NAME: ${APP_NAME:-My App}
      APP_URL: ${APP_URL:-http://localhost:3000}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-My App}
      NEXT_PUBLIC_COMPANY_LEGAL_NAME: ${NEXT_PUBLIC_COMPANY_LEGAL_NAME:-Acme Inc.}
      NEXT_PUBLIC_COMPANY_DISPLAY_NAME: ${NEXT_PUBLIC_COMPANY_DISPLAY_NAME:-Acme}
      NEXT_PUBLIC_COMPANY_CONTACT_EMAIL: ${NEXT_PUBLIC_COMPANY_CONTACT_EMAIL:-contact@example.com}
      NEXT_PUBLIC_COMPANY_CONTACT_PHONE: ${NEXT_PUBLIC_COMPANY_CONTACT_PHONE:-+1-555-0100}
      NEXT_PUBLIC_COMPANY_WEBSITE: ${NEXT_PUBLIC_COMPANY_WEBSITE:-https://example.com}
      NEXT_PUBLIC_COMPANY_ADDRESS_LINE1: ${NEXT_PUBLIC_COMPANY_ADDRESS_LINE1:-}
      NEXT_PUBLIC_COMPANY_CITY: ${NEXT_PUBLIC_COMPANY_CITY:-}
      NEXT_PUBLIC_COMPANY_PROVINCE: ${NEXT_PUBLIC_COMPANY_PROVINCE:-}
      NEXT_PUBLIC_COMPANY_POSTAL_CODE: ${NEXT_PUBLIC_COMPANY_POSTAL_CODE:-}
      NEXT_PUBLIC_COMPANY_COUNTRY: ${NEXT_PUBLIC_COMPANY_COUNTRY:-}
      NEXT_PUBLIC_BRAND_PRIMARY: ${NEXT_PUBLIC_BRAND_PRIMARY:-#2563eb}
      NEXT_PUBLIC_BRAND_SECONDARY: ${NEXT_PUBLIC_BRAND_SECONDARY:-#000000}
      NEXT_PUBLIC_BRAND_FONT: ${NEXT_PUBLIC_BRAND_FONT:-Inter, Arial, sans-serif}
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-http://127.0.0.1:54321}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:-replace_with_supabase_publishable_key}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-replace_with_supabase_service_role_key}
      INTERNAL_EMAIL_DOMAINS: ${INTERNAL_EMAIL_DOMAINS:-}
      PARTNER_EMAIL_DOMAINS: ${PARTNER_EMAIL_DOMAINS:-}
      MAILGUN_API_KEY: ${MAILGUN_API_KEY:-}
      MAILGUN_DOMAIN: ${MAILGUN_DOMAIN:-example.com}
      MAILGUN_FROM_EMAIL: ${MAILGUN_FROM_EMAIL:-My App <noreply@example.com>}
